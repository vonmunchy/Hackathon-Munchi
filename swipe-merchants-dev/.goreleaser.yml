version: 2

# Goreleaser config for the workspace layout: the binary lives in
# ./cli/cmd/swipe and its module path is github.com/BML-Digital/swipe-merchants-dev/cli.

project_name: swipe

before:
  hooks:
    - make -C cli sync-spec

builds:
  - id: swipe
    main: ./cmd/swipe
    dir: ./cli
    binary: swipe
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X 'github.com/BML-Digital/swipe-merchants-dev/cli/internal/version.Version={{.Version}}'
      - -X 'github.com/BML-Digital/swipe-merchants-dev/cli/internal/version.Commit={{.Commit}}'
      - -X 'github.com/BML-Digital/swipe-merchants-dev/cli/internal/version.BuildDate={{.Date}}'
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README.md
      - spec/app.yaml

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

release:
  github:
    owner: BML-Digital
    name: swipe-merchants-dev
  draft: true
  prerelease: auto

# Homebrew tap publishing is intentionally NOT wired into goreleaser
# because the source + tap repos live under an org and cross-repo
# write tokens are restricted. Instead, the tap formula at
# https://github.com/BML-Digital/homebrew-tap/blob/main/Formula/swipe.rb
# is updated by hand after each release using the checksums goreleaser
# emits in dist/swipe_<version>_checksums.txt. See that repo's README
# for the update procedure.
