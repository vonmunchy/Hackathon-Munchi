<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle shine overlay -->
  <rect width="512" height="256" rx="112" fill="url(#shine)"/>
  <!-- Shopping bag body -->
  <path d="M148 200 L148 390 Q148 420 178 420 L334 420 Q364 420 364 390 L364 200 Z" fill="none" stroke="white" stroke-width="28" stroke-linejoin="round" opacity="0.3"/>
  <!-- Bag handle as the top curve of the S -->
  <path d="M200 200 Q200 130 256 130 Q312 130 312 200" fill="none" stroke="white" stroke-width="30" stroke-linecap="round"/>
  <!-- The S flowing through the bag -->
  <path d="M296 210 Q340 210 340 260 Q340 310 256 310 Q172 310 172 360 Q172 410 216 410" fill="none" stroke="white" stroke-width="34" stroke-linecap="round"/>
  <!-- Small swift arrow accent -->
  <path d="M340 100 L380 120 L340 140" fill="none" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
</svg>
